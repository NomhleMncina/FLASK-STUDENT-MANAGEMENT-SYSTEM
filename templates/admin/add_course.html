{% extends "base.html" %}

{% block title %}Add Course - SMS{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Create New Course</h1>

    <form method="POST" action="{{ url_for('admin.add_course') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Course Code</label>
            <input type="text" name="course_code" placeholder="e.g. CS101" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Course Name</label>
            <input type="text" name="course_name" placeholder="e.g. Introduction to Computer Science" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div class="flex items-center justify-between pt-4">
            <a href="{{ url_for('admin.manage_courses') }}" class="text-sm text-gray-600 hover:text-gray-900">Cancel</a>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md text-sm">Save Course</button>
        </div>
    </form>
</div>
{% endblock %}
