{% extends "base.html" %}

{% block title %}Allocate Lecturer - SMS{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Allocate Lecturer</h1>

    <form method="POST" action="{{ url_for('admin.allocate_lecturer') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Select Lecturer</label>
            <select name="lecturer_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500">
                {% for lecturer in lecturers %}
                    <option value="{{ lecturer.LecturerID }}">{{ lecturer.FirstName }} {{ lecturer.LastName }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Select Student</label>
            <select name="student_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500">
                {% for student in students %}
                    <option value="{{ student.StudentID }}">{{ student.FirstName }} {{ student.LastName }} ({{ student.StudentNumber }})</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Select Course</label>
            <select name="course_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500">
                {% for course in courses %}
                    <option value="{{ course.CourseID }}">{{ course.CourseCode }} - {{ course.CourseName }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex items-center justify-between pt-4">
            <a href="{{ url_for('admin.manage_allocations') }}" class="text-sm text-gray-600 hover:text-gray-900">Cancel</a>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md text-sm">Create Allocation</button>
        </div>
    </form>
</div>
{% endblock %}
