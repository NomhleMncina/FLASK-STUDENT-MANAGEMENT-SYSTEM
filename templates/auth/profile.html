{% extends 'base.html' %}
{% block title %}Account Settings{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <!-- Section 1: Change Username / Email -->
    <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
        <h3 class="text-lg font-bold text-gray-800 mb-4">Change Username (Email)</h3>
        <form method="POST" action="{{ url_for('auth.profile') }}">
            <input type="hidden" name="action" value="change_username">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Current Email</label>
                <input type="email" value="{{ user.Email }}" disabled
                       class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-md text-gray-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">New Email Address</label>
                <input type="email" name="email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 px-4 rounded-md">
                Update Email
            </button>
        </form>
    </div>

    <!-- Section 2: Change Password -->
    <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
        <h3 class="text-lg font-bold text-gray-800 mb-2">Change Password</h3>
        <p class="text-xs text-gray-500 mb-4">
            Password must be at least 8 characters, contain an uppercase letter, a number, and a special character.
        </p>
        <form method="POST" action="{{ url_for('auth.profile') }}" class="space-y-4">
            <input type="hidden" name="action" value="change_password">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
                <input type="password" name="current_password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                <div class="relative">
                    <input type="password" id="newPassword" name="new_password" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 pr-10">
                    <button type="button" id="toggleNewPwBtn" onclick="togglePasswordVisibility('newPassword', 'toggleNewPwBtn')"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium py-2 px-4 rounded-md">
                Update Password
            </button>
        </form>
    </div>

</div>
{% endblock %}
