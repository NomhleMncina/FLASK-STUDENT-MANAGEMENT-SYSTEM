{% extends 'base.html' %}
{% block title %}Enter New Password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 border border-gray-200 mt-10">
    <h2 class="text-xl font-bold text-gray-800 text-center mb-4">Set New Password</h2>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <div class="relative">
                <input type="password" id="resetPw" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 pr-10">
                <button type="button" id="toggleResetBtn" onclick="togglePasswordVisibility('resetPw', 'toggleResetBtn')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
            <input type="password" name="confirm_password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md">
            Reset Password
        </button>
    </form>
</div>
{% endblock %}
