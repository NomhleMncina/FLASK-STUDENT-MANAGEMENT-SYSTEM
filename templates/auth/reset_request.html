{% extends 'base.html' %}
{% block title %}Reset Password Request{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 border border-gray-200 mt-10">
    <h2 class="text-xl font-bold text-gray-800 text-center mb-4">Reset Password</h2>
    <p class="text-sm text-gray-600 mb-6 text-center">Enter your registered email address and we will send you a reset link.</p>

    <form method="POST" action="{{ url_for('auth.reset_password_request') }}" class="space-y-4">
        <div>
            <label class="block text-gray-700 text-sm font-medium mb-1">Email Address</label>
            <input type="email" name="email" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
